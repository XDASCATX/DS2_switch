# DIAGNOSTIC manifest (2026-10-19): app/ds2_manifest.toml + the PROPOSED overrides, to see what codegen does with them.
# Neither app/ds2_manifest.toml nor config/ds2_overrides.proposed.toml is changed. Output goes to its own directory.
# `includes` must be inside [entrypoint]: the SDK passes only that table to RecompilerConfig::LoadFromTable
# (sdk/src/codegen/manifest.cpp:115); a top-level `includes` is silently ignored.

[project]
name = "ds2"
sdk_version = "0.10.0"
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/Default.xex"
out_directory_path = "generated/diag-overrides"
includes = ["../config/ds2_overrides.proposed.toml"]
